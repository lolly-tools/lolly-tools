{{!-- Single root <svg>, deliberately: the CLI's vector path (shells/cli/src/bridge.ts
      rootSvgOf) only descends through wrappers with exactly ONE drawable child, so a
      static <canvas> sibling would make this read as an HTML LAYOUT and svg/emf/eps/dxf
      export would fall back to a ~1 MB HTML file. The motion-export frame-clock anchor
      is therefore mounted on demand in beforeExport (see hooks.js) and removed in
      afterExport — armOverlayClock finds it with root.querySelector('[data-ov-clock]'),
      so it only has to exist, inside the export node, during a gif/apng/webm/mp4 capture.
      The trailing <script> below is exempt from rootSvgOf's drawable-child count
      (script/style/template/link/meta are), so it does NOT trigger the HTML-fallback,
      and the auto-fit anchor is stamped ON the root <svg> itself (data-img-key). --}}
{{!-- EXPORT FIDELITY — why render.formats is what it is (measured 2026-07-31):
      IN: svg (1.39 MB, everything intact), every raster format
      (png/jpg/webp/avif/tiff/cmyk-tiff + animated gif/apng/webp-anim/webm/mp4 —
      the browser paints the filters natively at the raster chokepoint; the CLI's
      resvg tier renders the plates, the misregistration and the grain correctly),
      and pdf/pdf-cmyk.
      OUT: emf, eps, eps-cmyk, dxf — MEASURED, not assumed. Those four share the
      SVG→IR walk in shells/web/src/bridge/svg-ir.ts, which SKIPs <filter> and
      <mask> (line 31), never reads mix-blend-mode, and only recovers a filter
      that is a plain drop shadow (parseSvgDropShadow explicitly rejects
      feTurbulence / feDisplacementMap / feComponentTransfer — i.e. exactly the
      bleed, degrade and grain that ARE this tool). Rendered here: eps 575 B,
      eps-cmyk 568 B, emf 708 B, dxf 851 B — three flat 1000×1000 rectangles and
      nothing else, with the plate <image>s dropped (engine/src/dxf.ts:138 drops
      image prims outright; the EMF/EPS decoder needs a browser canvas). Even in
      a browser, where the <image>s do decode, the separations and blends are
      lost and the last opaque plate simply covers the others. Do not re-add them.
      CAVEAT to tell users, not a blocker: PDF has no filter primitive, so
      export.ts's drawSvgVectorsInRegion rasterises any SVG containing a
      filter/gradient/pattern into ONE image at ~150 dpi (capped 2000 px) — a
      faithful but RASTER page. pdf-cmyk leaves that image XObject in DeviceRGB
      (renderCmykPdf skips image XObjects by design), so only the print marks are
      true DeviceCMYK; cmyk-tiff is the format that converts every pixel. --}}
<script>
/* Auto-fit the canvas to a newly chosen image (native pixel dimensions).
   hooks.js stamps the user-picked image's URL as data-img-key on the root <svg>
   (empty for the demo default / a live camera frame). This <script> re-runs on every
   paint (runTemplateScripts); when the key changes to a new image we snap the export
   Width/Height fields to the image's native size (probed, capped, aspect preserved) so
   the canvas takes the photo's own aspect ratio. The press effect then re-fills whatever
   the user resizes to afterwards, and we don't re-snap until a different image is chosen.
   Keyed on the #tool-canvas element (recreated per tool mount → auto-scoped per tool, and
   absent for the off-screen export canvas → never resizes the bar during an export).
   IIFE + var: recreated and re-run each render, so top-level const/let would throw. */
(function () {
  var anchor = document.querySelector('[data-img-key]');
  if (!anchor) return;
  var canvas = anchor.closest('#tool-canvas');
  if (!canvas) return;                        // off-screen export canvas → never touch the export bar
  var key = anchor.getAttribute('data-img-key') || '';
  if (!('__filterFitKey' in canvas)) {        // FIRST run for this freshly-mounted canvas (#tool-canvas is
    canvas.__filterFitKey = key;              // rebuilt per mount): adopt whatever image is already set as the
    return;                                   // baseline WITHOUT resizing, so a saved/restored file keeps its
  }                                           // saved export size (incl. a deliberate manual crop). Only a
                                              // LATER change to the image input triggers a snap.
  if (canvas.__filterFitKey === key) return;  // image unchanged since mount / last snap → respect manual resize
  if (!key) { canvas.__filterFitKey = ''; return; } // image cleared → adopt empty baseline, no resize
  var uEl = document.querySelector('[data-action="export-unit"]');
  if (uEl && uEl.value && uEl.value !== 'px') return; // a deliberate mm/in page — don't override it
  var wEl = document.querySelector('[data-action="export-width"]');
  var hEl = document.querySelector('[data-action="export-height"]');
  if (!wEl || !hEl) return;

  var MAX = 8000;                             // keep a huge original from blowing up the export
  function apply(nw, nh) {
    if (!(nw > 0 && nh > 0)) return;
    canvas.__filterFitKey = key;              // record BEFORE dispatch so the re-render it triggers is a no-op
    var s = Math.min(1, MAX / Math.max(nw, nh));
    var W = Math.max(1, Math.round(nw * s));
    var H = Math.max(1, Math.round(nh * s));
    var changed = false;
    if (parseFloat(wEl.value) !== W) { wEl.value = String(W); changed = true; }
    if (parseFloat(hEl.value) !== H) { hEl.value = String(H); changed = true; }
    if (changed) {
      wEl.dispatchEvent(new Event('input', { bubbles: true }));
      hEl.dispatchEvent(new Event('input', { bubbles: true }));
    }
  }

  var nw = parseFloat(anchor.getAttribute('data-img-w'));
  var nh = parseFloat(anchor.getAttribute('data-img-h'));
  if (nw > 0 && nh > 0) { apply(nw, nh); return; }  // fast path: the hook already decoded the image

  if (canvas.__filterFitProbe === key) return;      // a probe for this key is already in flight
  canvas.__filterFitProbe = key;
  var probe = new Image();
  probe.onload = function () { apply(probe.naturalWidth, probe.naturalHeight); };
  probe.onerror = function () { if (canvas.__filterFitProbe === key) canvas.__filterFitProbe = null; };
  probe.src = key;                                  // the key IS the image URL
  if (probe.complete && probe.naturalWidth > 0) apply(probe.naturalWidth, probe.naturalHeight);
})();
</script>
